<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <title>Fleet Response — Recovery Analytics</title>
    <link rel="stylesheet" href="./styles.css?v=6" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">FR</div>
          <div>
            <div class="brand-name">Fleet Response</div>
            <div class="brand-sub">Recovery operations analytics</div>
          </div>
        </div>
        <nav id="nav"></nav>
      <div class="sidebar-footer">
        <span class="badge-live"><span class="dot"></span> Private &amp; local</span>
        <div style="margin-top: 10px">
          Your CSV is processed entirely in your browser — never uploaded or stored.
        </div>
      </div>
      </aside>
      <main class="main">
        <div class="topbar">
          <div>
            <h1 class="page-title">Fleet Response Dashboard</h1>
            <div class="page-subtitle" id="subtitle">Loading…</div>
          </div>
          <div class="header-controls">
            <div class="controls" id="rangeControls"></div>
            <div id="geoControls"></div>
            <div id="fileControls"></div>
          </div>
        </div>
        <div id="content"></div>
      </main>
    </div>
    <input type="file" id="fileInput" accept=".csv,text/csv" style="display: none" />
    <script src="./app.js?v=13"></script>
  </body>
</html>
